{{- if not (or .Values.podProxier.enableV1 .Values.podProxier.enableV2) }}
{{- fail "at least one of podProxier.enableV1 or podProxier.enableV2 must be true" }}
{{- end }}
{{- $haproxyTag := .Values.images.haproxy.tag }}
{{- $podProxierTag := .Values.images.podProxier.tag }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-proxier
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: pod-proxier
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pod-proxier
    spec:
      serviceAccountName: {{ .Values.serviceAccount }}
      hostNetwork: {{ .Values.hostNetwork }}
      {{- if .Values.nodeName }}
      nodeName: {{ .Values.nodeName }}
      {{- end }}
      containers:
        - name: haproxy
          image: "{{ .Values.images.haproxy.repository }}:{{ if kindIs "float64" $haproxyTag }}{{ printf "%.0f" $haproxyTag }}{{ else }}{{ $haproxyTag }}{{ end }}"
          imagePullPolicy: {{ .Values.images.haproxy.pullPolicy }}
          ports:
            - containerPort: {{ .Values.ports.adminPort }}
              hostPort: {{ .Values.ports.adminPort }}
              name: admin-port
              protocol: TCP
            - containerPort: {{ .Values.ports.dataPlanPort }}
              name: data-plan-port
              protocol: TCP
            - containerPort: {{ .Values.ports.entryPort }}
              hostPort: {{ .Values.ports.entryPort }}
              name: entry-port
              protocol: TCP
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.haproxy.readiness.path }}
              port: {{ .Values.probes.haproxy.readiness.port }}
            initialDelaySeconds: {{ .Values.probes.haproxy.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.haproxy.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.haproxy.liveness.path }}
              port: {{ .Values.probes.haproxy.liveness.port }}
            initialDelaySeconds: {{ .Values.probes.haproxy.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.haproxy.liveness.periodSeconds }}
        - name: pod-proxier
          image: "{{ .Values.images.podProxier.repository }}:{{ if kindIs "float64" $podProxierTag }}{{ printf "%.0f" $podProxierTag }}{{ else }}{{ $podProxierTag }}{{ end }}"
          imagePullPolicy: {{ .Values.images.podProxier.pullPolicy }}
          ports:
            - containerPort: {{ .Values.ports.podProxierPort }}
          securityContext:
            runAsNonRoot: {{ .Values.podProxier.securityContext.runAsNonRoot }}
            runAsUser: {{ .Values.podProxier.securityContext.runAsUser }}
          command:
            - "sh"
            - "-c"
            - |
              sleep 15 &&
              /apps/pod-proxier-gateway \
              -v {{ .Values.logLevel }} \
              --listen-port={{ .Values.ports.podProxierPort }} \
              --listen-addr=0.0.0.0 \
              --api-addr={{ .Values.podProxier.apiAddr }} \
              --api-user={{ .Values.podProxier.apiUser }} \
              --api-password={{ .Values.podProxier.apiPassword }} \
              --resync-time={{ .Values.podProxier.resyncTime }} \
              --enable-v1={{ .Values.podProxier.enableV1 }} \
              --enable-v2={{ .Values.podProxier.enableV2 }}{{- if .Values.podProxier.enableV1 }} \
              --default-map-port={{ .Values.ports.defaultMapPort }} \
              --jprofiler-port-name={{ .Values.ports.jprofilerPortName }} \
              --max-mapping-time={{ .Values.podProxier.maxMappingTime }}{{- end }}{{- if .Values.podProxier.enableV2 }} \
              --port-name={{ .Values.podProxier.portName }} \
              --port-range-start={{ .Values.podProxier.portRangeStart }} \
              --port-range-end={{ .Values.podProxier.portRangeEnd }} \
              --allowed-namespaces={{ join "," .Values.podProxier.allowedNamespaces }} \
              --check-timeout={{ .Values.podProxier.checkTimeout }} \
              --check-interval={{ .Values.podProxier.checkInterval }} \
              --max-batch-size={{ .Values.podProxier.maxBatchSize }} \
              --hide-backend={{ .Values.podProxier.hideBackend }} \
              --off-check={{ .Values.podProxier.offCheck }}{{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.podProxier.readiness.path }}
              port: {{ .Values.probes.podProxier.readiness.port }}
            initialDelaySeconds: {{ .Values.probes.podProxier.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.podProxier.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.podProxier.liveness.path }}
              port: {{ .Values.probes.podProxier.liveness.port }}
            initialDelaySeconds: {{ .Values.probes.podProxier.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.podProxier.liveness.periodSeconds }}
